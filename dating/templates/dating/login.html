{% extends 'dating/base.html' %}
{% load static %}

{% block title %}Вход — КУЛЬТ{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 60px auto; padding: 0 20px;">
    <div style="background: #0D1824; border-radius: 24px; padding: 30px; box-shadow: 0 14px 40px rgba(0,0,0,0.6), 0 0 30px rgba(111,45,189,0.1);">
        <h2 style="text-align: center; font-family: 'Cormorant Garamond', serif; font-size: 2.4rem; margin-bottom: 8px; color: #F7F7FB;">Вход</h2>
        <p style="text-align: center; color: #A6ADBA; margin-bottom: 24px;">Войдите в свой аккаунт</p>

        <form method="post" class="form-premium" style="display: flex; flex-direction: column; gap: 16px;">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn--primary" style="width: 100%; padding: 14px;">Войти</button>
        </form>
        <p style="text-align: center; margin-top: 16px; color: #A6ADBA;">
            Нет аккаунта? <a href="{% url 'dating:register' %}" style="color: #A855F7;">Зарегистрироваться</a>
        </p>
    </div>
</div>
{% endblock %}
