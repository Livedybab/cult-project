{% extends 'dating/base.html' %}
{% load static %}

{% block title %}Онбординг — КУЛЬТ{% endblock %}

{% block content %}
<section style="padding: 40px 0;">
    <div class="container" style="max-width: 600px; margin: 0 auto;">
        <div style="background: #0D1824; border-radius: 24px; padding: 30px; box-shadow: 0 14px 40px rgba(0,0,0,0.6), 0 0 30px rgba(111,45,189,0.1);">
            <h2 style="font-family: 'Cormorant Garamond', serif; font-size: 2rem; text-align: center; margin-bottom: 8px;">Шаг {{ step }} из {{ total_steps }}</h2>
            <p style="text-align: center; color: #A6ADBA; margin-bottom: 24px;">{{ step_title }}</p>

            <form method="post" class="form-premium" style="display: flex; flex-direction: column; gap: 16px;">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn--primary" style="width: 100%; padding: 14px;">
                    {% if step == total_steps %}Завершить{% else %}Далее →{% endif %}
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
